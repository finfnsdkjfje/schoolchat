<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>School Chat Room</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; height: 100vh; display: flex; flex-direction: column; }
    
    header { background: #4a76a8; color: white; padding: 15px; text-align: center; font-size: 20px; font-weight: bold; }
    
    #setup-box { display: flex; justify-content: center; align-items: center; background: #e2e8f0; padding: 10px; gap: 10px; }
    #username-input { padding: 8px; border-radius: 4px; border: 1px solid #ccc; font-size: 14px; }
    
    #messages { flex: 1; overflow-y: auto; padding: 20px; list-style-type: none; display: flex; flex-direction: column; gap: 10px; }
    .message { background: white; padding: 10px 15px; border-radius: 8px; max-width: 70%; width: fit-content; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
    .message .meta { font-size: 11px; color: #888; margin-bottom: 4px; }
    .message .username { font-weight: bold; color: #333; }
    .message .text { font-size: 15px; color: #111; word-break: break-word; }

    #form { display: flex; padding: 15px; background: white; border-top: 1px solid #ddd; gap: 10px; }
    #input { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; outline: none; }
    button { padding: 12px 24px; background: #4a76a8; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    button:hover { background: #3b628e; }
  </style>
</head>
<body>

  <header>School Chat Room</header>

  <div id="setup-box">
    <label for="username-input"><strong>Your Name:</strong></label>
    <input id="username-input" placeholder="Type name..." value="Student" />
  </div>

  <ul id="messages"></ul>

  <form id="form">
    <input id="input" autocomplete="off" placeholder="Type a message..." />
    <button>Send</button>
  </form>

  <!-- Load Socket.IO library automatically from server -->
  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const usernameInput = document.getElementById('username-input');
    const messages = document.getElementById('messages');

    // Display a message on screen
    function appendMessage(data) {
      const item = document.createElement('li');
      item.className = 'message';
      item.innerHTML = `
        <div class="meta"><span class="username">${escapeHTML(data.user)}</span> • ${data.time}</div>
        <div class="text">${escapeHTML(data.text)}</div>
      `;
      messages.appendChild(item);
      messages.scrollTop = messages.scrollHeight; // Auto scroll to bottom
    }

    // Escape text to prevent HTML injection
    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    // Load full history when joining
    socket.on('load history', (history) => {
      messages.innerHTML = '';
      history.forEach(appendMessage);
    });

    // Receive new real-time message
    socket.on('chat message', appendMessage);

    // Send message on form submit
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      if (input.value.trim()) {
        socket.emit('chat message', {
          user: usernameInput.value.trim() || 'Student',
          text: input.value.trim()
        });
        input.value = '';
      }
    });
  </script>
</body>
</html>
