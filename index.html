<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DSA & CS Chat Room</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; height: 100vh; display: flex; flex-direction: column; }
    
    header { background: #4a76a8; color: white; padding: 15px; text-align: center; font-size: 20px; font-weight: bold; }
    
    #main-container { display: flex; flex: 1; overflow: hidden; }

    /* Sidebar */
    #sidebar { width: 220px; background: #2f3136; color: white; display: flex; flex-direction: column; padding: 10px 0; }
    #sidebar h3 { padding: 10px 15px; font-size: 12px; text-transform: uppercase; color: #8e9297; }
    .channel-btn { background: none; border: none; color: #dcddde; padding: 10px 15px; text-align: left; font-size: 14px; cursor: pointer; width: 100%; }
    .channel-btn:hover { background: #36393f; color: white; }
    .channel-btn.active { background: #393c43; color: white; font-weight: bold; }

    /* Chat Area */
    #chat-area { flex: 1; display: flex; flex-direction: column; background: #f0f2f5; }
    
    #setup-box { display: flex; justify-content: space-between; align-items: center; background: #e2e8f0; padding: 10px 20px; border-bottom: 1px solid #ccc; }
    #username-input { padding: 6px 10px; border-radius: 4px; border: 1px solid #ccc; font-size: 14px; }
    
    #messages { flex: 1; overflow-y: auto; padding: 20px; list-style-type: none; display: flex; flex-direction: column; gap: 10px; }
    .message { background: white; padding: 10px 15px; border-radius: 8px; max-width: 70%; width: fit-content; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
    .message .meta { font-size: 11px; color: #888; margin-bottom: 4px; }
    .message .username { font-weight: bold; color: #333; }
    .message .text { font-size: 15px; color: #111; word-break: break-word; }

    #form { display: flex; padding: 15px; background: white; border-top: 1px solid #ddd; gap: 10px; }
    #input { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; outline: none; }
    #send-btn { padding: 12px 24px; background: #4a76a8; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    #send-btn:hover { background: #3b628e; }
  </style>
</head>
<body>

  <header>DSA & CS Majors Chat</header>

  <div id="main-container">
    <div id="sidebar">
      <h3>DSA Topics</h3>
      <button class="channel-btn active" onclick="switchRoom('General', this)"># General</button>
      <button class="channel-btn" onclick="switchRoom('DataStructures', this)"># Data-Structures</button>
      <button class="channel-btn" onclick="switchRoom('Algorithms', this)"># Algorithms</button>
      <button class="channel-btn" onclick="switchRoom('WebDev', this)"># Web-Development</button>
      <button class="channel-btn" onclick="switchRoom('MachineLearning', this)"># Machine-Learning</button>
      <button class="channel-btn" onclick="switchRoom('Cybersecurity', this)"># Cybersecurity</button>
    </div>

    <div id="chat-area">
      <div id="setup-box">
        <div><strong>Current Channel:</strong> <span id="current-room-label">General</span></div>
        <div>
          <label for="username-input"><strong>Your Name:</strong></label>
          <input id="username-input" placeholder="Type name..." value="Coder" />
        </div>
      </div>

      <ul id="messages"></ul>

      <form id="form">
        <input id="input" autocomplete="off" placeholder="Type a message..." />
        <button id="send-btn">Send</button>
      </form>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const usernameInput = document.getElementById('username-input');
    const messages = document.getElementById('messages');
    const currentRoomLabel = document.getElementById('current-room-label');

    let currentRoom = 'General';

    socket.emit('join room', currentRoom);

    function switchRoom(roomName, btnElement) {
      currentRoom = roomName;
      currentRoomLabel.textContent = roomName;
      
      document.querySelectorAll('.channel-btn').forEach(btn => btn.classList.remove('active'));
      btnElement.classList.add('active');

      socket.emit('join room', roomName);
    }

    function appendMessage(data) {
      const item = document.createElement('li');
      item.className = 'message';
      item.innerHTML = `
        <div class="meta"><span class="username">${escapeHTML(data.user)}</span> • ${data.time}</div>
        <div class="text">${escapeHTML(data.text)}</div>
      `;
      messages.appendChild(item);
      messages.scrollTop = messages.scrollHeight;
    }

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    socket.on('load history', (history) => {
      messages.innerHTML = '';
      history.forEach(appendMessage);
    });

    socket.on('chat message', appendMessage);

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      if (input.value.trim()) {
        socket.emit('chat message', {
          user: usernameInput.value.trim() || 'Coder',
          text: input.value.trim()
        });
        input.value = '';
      }
    });
  </script>
</body>
</html>
